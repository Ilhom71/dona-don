# donadon.atata.uz - Donadon (ombor + savdo boshqaruv tizimi)
#
# Serverda: /etc/nginx/sites-available/donadon.atata.uz nomi bilan saqlanadi,
# so'ng /etc/nginx/sites-enabled/ ga symlink qilinadi.
#
# SSL: bu konfig HTTP (80) uchun. Serverda bir marta:
#   sudo certbot --nginx -d donadon.atata.uz
# certbot 443 blokini va HTTP->HTTPS yo'naltirishni shu faylga o'zi qo'shadi.

upstream donadon_api {
    server 127.0.0.1:4000;   # backend (Bun/Hono) - backend/.env dagi PORT
    keepalive 16;
}

upstream donadon_web {
    server 127.0.0.1:3030;   # frontend (Next.js) - ecosystem.config.cjs dagi PORT
    keepalive 16;            # 3000 serverda band, shuning uchun 3030
}

server {
    listen 80;
    server_name donadon.atata.uz;

    access_log /var/log/nginx/donadon.access.log;
    error_log  /var/log/nginx/donadon.error.log;

    # Excel import fayllari uchun (standart 1m kichik bo'lishi mumkin)
    client_max_body_size 20m;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/css application/javascript application/json image/svg+xml;

    # ── API → Bun backend ────────────────────────────────────────────────────
    # "/api/" prefiksi olib tashlanib uzatiladi: /api/auth/login → /auth/login
    # (proxy_pass oxiridagi "/" shuni bildiradi). Frontend bilan bir xil origin
    # bo'lgani uchun CORS muammosi bo'lmaydi va httpOnly cookie ishlaydi.
    location /api/ {
        proxy_pass         http://donadon_api/;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Excel eksport katta bo'lsa uzilib qolmasin
        proxy_read_timeout 300s;
    }

    # ── Frontend → Next.js ───────────────────────────────────────────────────
    location / {
        proxy_pass         http://donadon_web;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
